<title>Aufmaß Glasfaser Münster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#E9ECEE; --surface:#FFFFFF; --surface-2:#F4F6F7;
    --ink:#15222A; --muted:#5C6C76; --line:#CFD7DB; --line-soft:#E2E8EB;
    --accent:#0E6E78; --accent-hi:#0B565E; --on-accent:#FFFFFF;
    --signal:#B4551A; --danger:#A32C22; --ok:#2C6E52;
    --shadow:0 1px 2px rgba(21,34,42,.06), 0 6px 20px rgba(21,34,42,.07);
    --sans:"IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0D1317; --surface:#151E24; --surface-2:#1B262D;
      --ink:#E4ECF0; --muted:#94A5AE; --line:#27353D; --line-soft:#1F2C33;
      --accent:#43A7B2; --accent-hi:#57BBC6; --on-accent:#08171A;
      --signal:#DE9354; --danger:#E4796D; --ok:#63B892;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0D1317; --surface:#151E24; --surface-2:#1B262D;
    --ink:#E4ECF0; --muted:#94A5AE; --line:#27353D; --line-soft:#1F2C33;
    --accent:#43A7B2; --accent-hi:#57BBC6; --on-accent:#08171A;
    --signal:#DE9354; --danger:#E4796D; --ok:#63B892;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.45;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:0 40px}

  /* ---------- Kopfleiste ---------- */
  .bar{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
    background:color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .bar-in{
    max-width:1180px; margin:0 auto; padding:10px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:1px; min-width:0}
  .brand b{font-size:15px; font-weight:600; letter-spacing:-.01em}
  .brand span{
    font-size:11px; color:var(--muted); font-family:var(--mono);
    text-transform:uppercase; letter-spacing:.08em;
  }
  #blattwahl{
    font:inherit; font-size:14px; font-weight:500; color:var(--ink);
    background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; cursor:pointer; margin-right:auto;
  }
  #blattwahl:hover{border-color:var(--accent)}
  .count{
    font-family:var(--mono); font-size:12px; color:var(--muted);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }

  button{font:inherit; cursor:pointer; border-radius:8px; border:1px solid transparent}
  .btn-main{
    background:var(--accent); color:var(--on-accent); border-color:var(--accent);
    padding:9px 16px; font-weight:600; letter-spacing:.01em;
  }
  .btn-main:hover:not(:disabled){background:var(--accent-hi); border-color:var(--accent-hi)}
  .btn-main:disabled{opacity:.5; cursor:not-allowed}
  .btn-ghost{
    background:var(--surface); color:var(--ink); border-color:var(--line);
    padding:7px 12px; font-size:13px;
  }
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent)}
  .btn-ghost.btn-warn, .btn-ghost.btn-warn:hover{
    color:var(--danger); border-color:var(--danger); font-weight:600;
  }
  .btn-icon{
    background:none; border:none; color:var(--muted); padding:4px;
    line-height:1; border-radius:6px; font-size:18px;
  }
  .btn-icon:hover{color:var(--danger); background:var(--surface-2)}
  :is(button, input, select, label):focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ---------- Abschnitte ---------- */
  section{margin-top:26px}
  .head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
  h2{
    margin:0; font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:.1em; color:var(--muted); font-family:var(--mono);
  }
  .head .note{font-size:12px; color:var(--muted); margin-left:auto}
  .panel{
    background:var(--surface); border:1px solid var(--line-soft);
    border-radius:12px; box-shadow:var(--shadow);
  }

  /* ---------- Kopfdaten ---------- */
  .fields{
    display:grid; gap:1px; background:var(--line-soft);
    grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
    border-radius:12px; overflow:hidden;
  }
  .field{background:var(--surface); padding:9px 12px 10px; display:flex; flex-direction:column; gap:3px}
  .field label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); font-weight:500;
  }
  .field input{
    border:none; background:none; color:var(--ink); font:inherit;
    font-size:14.5px; padding:2px 0; width:100%; min-width:0;
  }
  .field input:focus{outline:none}
  .field:focus-within{background:var(--surface-2)}

  /* ---------- Positionen ---------- */
  .rows{display:flex; flex-direction:column; gap:1px; background:var(--line-soft);
        border-radius:12px; overflow:hidden}
  .row{background:var(--surface); display:grid; align-items:center; gap:10px; padding:8px 12px}
  .row:focus-within{background:var(--surface-2)}
  .rowhead{
    display:grid; gap:10px; padding:0 12px 6px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); font-weight:500;
  }
  .num{
    font-family:var(--mono); font-size:11.5px; color:var(--muted);
    font-variant-numeric:tabular-nums; text-align:right;
  }
  .row input, .row select{
    width:100%; min-width:0; font:inherit; font-size:14px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line-soft);
    border-radius:7px; padding:7px 8px;
  }
  .row select{cursor:pointer}
  .row input:focus, .row select:focus{border-color:var(--accent); outline:none}
  .row input.menge{
    font-family:var(--mono); font-variant-numeric:tabular-nums;
    text-align:right; font-weight:500;
  }
  .row input.menge:not(:placeholder-shown){color:var(--signal)}
  .meta{
    display:flex; flex-direction:column; gap:1px; font-family:var(--mono);
    font-size:11px; line-height:1.25; color:var(--muted); min-width:0;
  }
  .meta b{font-weight:500; color:var(--ink); letter-spacing:-.01em}
  .meta.leer{opacity:.4}
  .row.unvollstaendig{box-shadow:inset 3px 0 0 var(--danger)}
  .mlabel{
    display:none; font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin-bottom:2px;
  }
  .add{margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}

  /* ---------- Summen ---------- */
  .sums{display:flex; flex-wrap:wrap; gap:8px}
  .sum{
    background:var(--surface); border:1px solid var(--line-soft);
    border-radius:9px; padding:7px 11px; display:flex; flex-direction:column; gap:1px;
    box-shadow:var(--shadow);
  }
  .sum span{font-size:11px; color:var(--muted); max-width:24ch}
  .sum b{
    font-family:var(--mono); font-size:15px; font-weight:500; color:var(--signal);
    font-variant-numeric:tabular-nums;
  }
  .sum b i{font-style:normal; font-size:11px; color:var(--muted); margin-left:3px}

  /* ---------- Unterschrift ---------- */
  .sig{padding:12px 14px; display:flex; gap:16px; align-items:center; flex-wrap:wrap}
  .sig-vorschau{
    width:190px; height:64px; border:1px dashed var(--line);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); flex:none; overflow:hidden; padding:5px;
  }
  .sig-vorschau img{max-width:100%; max-height:100%; object-fit:contain}
  .sig-vorschau span{font-size:11.5px; color:var(--muted); text-align:center; padding:0 8px}
  .sig-text{flex:1 1 240px; min-width:0; display:flex; flex-direction:column; gap:8px}
  .sig-text p{margin:0; font-size:12.5px; color:var(--muted)}
  .sig-knoepfe{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .schalter{display:flex; gap:8px; align-items:center; font-size:14px; cursor:pointer}
  .schalter input{width:17px; height:17px; accent-color:var(--accent); cursor:pointer}
  .schalter.aus{opacity:.5; cursor:not-allowed}
  .schalter.aus input{cursor:not-allowed}

  /* ---------- Meldungen ---------- */
  .msg{
    margin-top:14px; padding:10px 13px; border-radius:9px; font-size:13.5px;
    border:1px solid; white-space:pre-line;
  }
  .msg.fehler{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 35%, transparent);
              background:color-mix(in srgb, var(--danger) 8%, var(--surface))}
  .msg.gut{color:var(--ok); border-color:color-mix(in srgb, var(--ok) 35%, transparent);
           background:color-mix(in srgb, var(--ok) 8%, var(--surface))}

  footer{
    margin-top:30px; padding-top:16px; border-top:1px solid var(--line);
    font-size:12px; color:var(--muted); display:flex; gap:12px;
    justify-content:space-between; flex-wrap:wrap;
  }

  /* ---------- Handy ---------- */
  @media (max-width:860px){
    .rowhead{display:none}
    .rows{gap:8px; background:none}
    .row{
      grid-template-columns:repeat(2, minmax(0,1fr)) !important;
      border:1px solid var(--line-soft); border-radius:11px; padding:12px; gap:8px;
    }
    .row .num{grid-column:1 / -1; text-align:left; font-size:11px; letter-spacing:.06em}
    .row .breit, .row .c-meta{grid-column:1 / -1}
    .row .c-loesch{grid-column:1 / -1; justify-self:end}
    .mlabel{display:block}
    .meta{flex-direction:row; gap:10px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>

<div class="bar">
  <div class="bar-in">
    <div class="brand">
      <b>Aufmaßblatt</b>
      <span id="untertitel">…</span>
    </div>
    <select id="blattwahl" aria-label="Aufmaßblatt wählen"></select>
    <div class="count" id="zaehler">0 von 30 Zeilen</div>
    <button class="btn-main" id="btn-pdf" type="button">PDF erstellen</button>
  </div>
</div>

<div class="wrap">
  <section>
    <div class="head">
      <h2>Baustelle</h2>
      <div class="note">Wird in den Kopf des Aufmaßblatts übernommen</div>
    </div>
    <div class="fields panel" id="kopf"></div>
  </section>

  <section>
    <div class="head">
      <h2>Positionen</h2>
      <div class="note" id="positionen-hinweis"></div>
    </div>
    <div class="rowhead" id="rowhead"></div>
    <div class="rows" id="zeilen"></div>
    <div class="add">
      <button class="btn-ghost" id="btn-add" type="button">+ Zeile</button>
      <button class="btn-ghost" id="btn-leer" type="button">Alles leeren</button>
    </div>
  </section>

  <section id="summen-box" hidden>
    <div class="head"><h2>Summen</h2><div class="note">Kontrolle vor der Unterschrift</div></div>
    <div class="sums" id="summen"></div>
  </section>

  <section>
    <div class="head"><h2>Unterschrift</h2><div class="note">Bleibt auf diesem Gerät</div></div>
    <div class="panel sig">
      <div class="sig-vorschau" id="sig-vorschau"></div>
      <div class="sig-text">
        <label class="schalter" id="sig-schalter">
          <input type="checkbox" id="sig-an">
          <span>Unterschrift und Stempel bei „Auftragnehmer“ einsetzen</span>
        </label>
        <p id="sig-hinweis"></p>
        <div class="sig-knoepfe">
          <button class="btn-ghost" id="btn-sig-laden" type="button">Bild hinterlegen</button>
          <button class="btn-ghost" id="btn-sig-weg" type="button" hidden>Entfernen</button>
          <input type="file" id="sig-datei" accept="image/png,image/jpeg,image/webp" hidden>
        </div>
      </div>
    </div>
  </section>

  <div id="meldung"></div>

  <footer>
    <div>Entwurf wird je Blatt im Browser gespeichert.</div>
    <div id="fusszeilen"></div>
  </footer>
</div>

       kasten:{x0:35.5, y0:359.0, x1:573.0, y1:388.5, groesse:7.6, zeilenhoehe:9.2}}

  /* Frühere Bezeichnungen aus gespeicherten Entwürfen mitnehmen.
     "(bis 96F.)" wird auf "" abgebildet: die Position ist entfallen, die
     Zeile fällt dadurch sichtbar in die Prüfung statt still zu verschwinden. */
  const ALTNAMEN = {
    "GF-Kabel vorb. & Spleißen (bis 24F.)": "Glasfaserkabel vorbereiten und spleißen",
    "GF-Kabel vorb. & Spleißen (bis 96F.)": "",
    "Stunden Monteur": "Normalstunde Monteur Glasfaser"
  };

  /* ===================== Zustand ===================== */
  const SPEICHER = id => "aufmass-entwurf-v2-" + id;
  const SPEICHER_ALT = "aufmass-entwurf-v1";      /* nur HK, vor der Blattauswahl */
  const SPEICHER_SIG = "aufmass-unterschrift-v1";
  const SPEICHER_BLATT = "aufmass-blatt-v1";

  let blatt = BLAETTER[0];
  const entwuerfe = {};                            /* id -> {kopf, zeilen} */
  let unterschrift = null;                         /* Daten-URL oder null */
  let unterschriftAn = false;

  function heute(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
             + "-" + String(d.getDate()).padStart(2,"0");
  }
  function neueZeile(){ return {f:{}, taetigkeit:"", menge:"", bemerkung:"", m:{}}; }

  function frischerEntwurf(b){
    const kopf = {};
    b.kopf.forEach(f => kopf[f.id] = f.vorgabe);
    kopf.datum = heute();
    return {kopf, zeilen:[neueZeile(), neueZeile(), neueZeile()]};
  }

  function zeileSaeubern(b, z){
    const neu = neueZeile();
    if(!z || typeof z !== "object") return neu;
    b.felder.forEach(f => { neu.f[f.key] = String((z.f && z.f[f.key]) || ""); });
    if(b.modus === "auswahl"){
      let t = String(z.taetigkeit || "");
      if(Object.prototype.hasOwnProperty.call(ALTNAMEN, t)) t = ALTNAMEN[t];
      neu.taetigkeit = b.mengen.some(m => m.name === t) ? t : "";
      neu.menge = String(z.menge || "");
      neu.bemerkung = String(z.bemerkung || "");
    }else{
      b.mengen.forEach(m => { neu.m[m.key] = String((z.m && z.m[m.key]) || ""); });
    }
    /* alte HK-Entwürfe hatten nvt direkt auf der Zeile */
    if(!neu.f.nvt && z.nvt) neu.f.nvt = String(z.nvt);
    return neu;
  }

  function entwurfLaden(b){
    const frisch = frischerEntwurf(b);
    let roh = null;
    try{
      roh = localStorage.getItem(SPEICHER(b.id));
      if(!roh && b.id === "hk") roh = localStorage.getItem(SPEICHER_ALT);
    }catch(e){ /* kein Zugriff auf den Speicher */ }
    if(!roh) return frisch;
    try{
      const g = JSON.parse(roh);
      if(g && typeof g === "object"){
        if(g.kopf) Object.keys(frisch.kopf).forEach(k => {
          if(typeof g.kopf[k] === "string") frisch.kopf[k] = g.kopf[k];
        });
        if(Array.isArray(g.zeilen) && g.zeilen.length){
          frisch.zeilen = g.zeilen.slice(0, MAX(b)).map(z => zeileSaeubern(b, z));
        }
      }
    }catch(e){ /* unlesbarer Entwurf - der frische Stand bleibt */ }
    return frisch;
  }

  function entwurf(){ 
    if(!entwuerfe[blatt.id]) entwuerfe[blatt.id] = entwurfLaden(blatt);
    return entwuerfe[blatt.id];
  }
  function sichern(){
    try{
      localStorage.setItem(SPEICHER(blatt.id), JSON.stringify(entwurf()));
      localStorage.setItem(SPEICHER_BLATT, blatt.id);
    }catch(e){ /* Speichern nicht möglich - Eingabe bleibt trotzdem nutzbar */ }
  }

  /* ===================== Zahlen ===================== */
  function zahl(text){
    const t = String(text == null ? "" : text).trim().replace(",", ".");
    if(!t) return null;
    const n = Number(t);
    return Number.isFinite(n) ? n : null;
  }
  function zahlText(n){
    if(n == null) return "";
    return (Math.round(n * 100) / 100).toLocaleString("de-DE", {maximumFractionDigits:2});
  }

  function rasterSpalten(){
    const teile = ["26px"];
    blatt.felder.forEach(f => teile.push(f.weite || "1fr"));
    if(blatt.modus === "auswahl"){
      teile.push("minmax(0,1fr)", "104px", "96px");
      if(blatt.bemerkung) teile.push("minmax(0,1fr)");
    }else{
      blatt.mengen.forEach(() => teile.push("minmax(74px,1fr)"));

    teile.push("30px");
    return teile.join(" ");

    const del = document.createElement("div"); del.className = "c-loesch";

  function summenZeichnen(){

        if(t && n != null) summe.set(t.key, (summe.get(t.key) || 0) + n);
      }else{
        blatt.mengen.forEach(m => {
          const n = zahl(z.m[m.key]);

    elSummen.textContent = "";

  function zeileFehler(z){
    if(blatt.modus === "auswahl"){
      if(z.menge.trim() && !z.taetigkeit) return "Menge eingetragen, aber keine Tätigkeit gewählt.";
      if(z.taetigkeit && z.menge.trim() && zahl(z.menge) == null)
        return "„" + z.menge + "“ ist keine Zahl.";
      return "";
    }
    for(const m of blatt.mengen){
      const w = (z.m[m.key] || "").trim();
      if(w && zahl(w) == null) return "„" + w + "“ ist keine Zahl.";
    }
    const f = blatt.felder.find(f => f.zahl);
    if(f){
      const w = (z.f[f.key] || "").trim();
      if(w && zahl(w) == null) return "„" + w + "“ ist keine Zahl.";
    }
    if(blatt.mengen.some(m => (z.m[m.key] || "").trim())
       && !blatt.felder.some(f => (z.f[f.key] || "").trim()))
      return "Mengen eingetragen, aber " + blatt.felder[0].label + " fehlt.";
    return "";
  }

  /* Weiß aus dem Bild nehmen, Farben unverändert lassen. */
  function freistellen(bild){
    const MAXB = 1100;
    const skala = Math.min(1, MAXB / bild.naturalWidth);
    const w = Math.max(1, Math.round(bild.naturalWidth * skala));
    const h = Math.max(1, Math.round(bild.naturalHeight * skala));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d", {willReadFrequently:true});
    ctx.drawImage(bild, 0, 0, w, h);
    const bild2 = ctx.getImageData(0, 0, w, h);
    const d = bild2.data;
    const VOLL = 215, LEER = 246;
    for(let i = 0; i < d.length; i += 4){
      if(d[i+3] === 0) continue;
      const m = Math.min(d[i], d[i+1], d[i+2]);
      if(m >= LEER) d[i+3] = 0;
      else if(m > VOLL) d[i+3] = Math.min(d[i+3], Math.round(255*(LEER-m)/(LEER-VOLL)));
    }
    ctx.putImageData(bild2, 0, 0);
    return c.toDataURL("image/png");
  }

  /* ===================== PDF ===================== */
  function skriptLaden(src){
    return new Promise((ok, fehl) => {
      const s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = () => fehl(new Error(src));
      document.head.appendChild(s);
    });
  }
  const pdfLib = (async () => {
    if(window.PDFLib) return window.PDFLib;
    try{ await skriptLaden("pdf-lib.min.js"); }
    catch(e){
      await skriptLaden("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js");
    }
    if(!window.PDFLib) throw new Error("PDF-Bibliothek nicht geladen");
    return window.PDFLib;
  })().catch(e => e);

  function bytesAusB64(b64){
    const roh = atob(b64);
    const bytes = new Uint8Array(roh.length);
    for(let i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);
    return bytes;
  }

  /* Standardschriften des PDF können nur WinAnsi - alles andere ersetzen */
  const ERSATZ = {"–":"-","—":"-","‘":"'","’":"'","‚":"'",
                  "“":'"',"”":'"',"„":'"',"…":"..."," ":" ",
                  "−":"-","•":"-"};
  function winAnsi(text){
    return String(text == null ? "" : text)
      .replace(/[–—‘’‚“”„… −•]/g,
               c => ERSATZ[c])
      .replace(/[^ -~ -ÿ]/g, "");
  }

  function zelle(n, spalte){
    const oben = blatt.raster.oben + (n - 1) * blatt.raster.hoehe;
    return [spalte[0], oben, spalte[1], oben + blatt.raster.hoehe];
  }

  /* Manche Blaetter setzen die Zeilen in mehrere Bloecke nebeneinander.
     Liefert fuer Zeile n die Zeilennummer im Block und dessen Spalten. */
  function blockFuer(n){
    if(!blatt.bloecke) return null;
    let start = 1;
    for(const b of blatt.bloecke){
      if(n < start + b.zeilen) return {zeile:n - start + 1, spalten:b.spalten};
      start += b.zeilen;
    }
    return null;
  }

  /* Freitext ueber mehrere Zeilen in einen Kasten setzen. */
  function schreibenBlock(seite, k, text, schrift){
    const roh = winAnsi(text).trim();
    if(!roh) return;
    const breite = k.x1 - k.x0;
    const worte = roh.split(/\s+/);
    const zeilen = [];
    let aktuell = "";
    worte.forEach(w => {
      const versuch = aktuell ? aktuell + " " + w : w;
      if(schrift.widthOfTextAtSize(versuch, k.groesse) <= breite || !aktuell){
        aktuell = versuch;
      }else{
        zeilen.push(aktuell); aktuell = w;
      }
    });
    if(aktuell) zeilen.push(aktuell);
    const platz = Math.max(1, Math.floor((k.y1 - k.y0) / k.zeilenhoehe));
    zeilen.slice(0, platz).forEach((z, i) => {
      seite.drawText(z, {x:k.x0, y:SEITE_H - (k.y0 + k.zeilenhoehe * (i + 0.78)),
                         size:k.groesse, font:schrift});
    });
  }

  function schreiben(seite, kasten, text, groesse, schrift){
    const t = winAnsi(text).trim();
    if(!t) return;
    const [x0, y0, x1, y1] = kasten;
    const platz = x1 - x0 - 2;
    let g = groesse;
    while(g > 3.4 && schrift.widthOfTextAtSize(t, g) > platz) g -= 0.2;
    const breite = schrift.widthOfTextAtSize(t, g);
    const x = x0 + (x1 - x0 - breite) / 2;
    const grundlinie = (y0 + y1) / 2 + g * 0.35;
    seite.drawText(t, {x, y: SEITE_H - grundlinie, size:g, font:schrift});
  }

  function datumText(iso){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || "").trim());
    return m ? m[3] + "." + m[2] + "." + m[1] : String(iso || "").trim();
  }

  async function pdfBauen(){
    const lib = await pdfLib;
    if(lib instanceof Error) throw lib;
    const {PDFDocument, StandardFonts, rgb} = lib;
    const daten = entwurf();

    SEITE_H = blatt.hoehe || 595.219970703125;
    const doc = await PDFDocument.load(bytesAusB64(blatt.vorlage));
    const seite = doc.getPage(0);
    const normal = await doc.embedFont(StandardFonts.Helvetica);
    const fett = await doc.embedFont(StandardFonts.HelveticaBold);
    const weiss = rgb(1, 1, 1);

    /* Spalten, die es im Leistungsverzeichnis nicht gibt, aus dem Blatt nehmen */
    if(blatt.umbau){
      const u = blatt.umbau;
      u.weissen.forEach(w => seite.drawRectangle({
        x:w.x0, y:SEITE_H - w.y1, width:w.x1 - w.x0, height:w.y1 - w.y0, color:weiss
      }));
      const balken = (x0, x1, y, h) => seite.drawRectangle({
        x:x0, y:SEITE_H - y - h, width:x1 - x0, height:h, color:rgb(0, 0, 0)
      });
      (u.balken || []).forEach(b => balken(b.x0, b.x1, b.y, b.h));
      const tr = u.trenner;
      if(tr){
        for(let k = 0; k < tr.anzahl; k++){
          balken(tr.x0, tr.x1, tr.y0 + k * tr.schritt, tr.h);
        }
      }
      (u.kopfzeilen || []).forEach(z => {
        const t = winAnsi(z.text);
        const b = fett.widthOfTextAtSize(t, z.groesse);
        seite.drawText(t, {x:z.x - b/2, y:SEITE_H - z.y, size:z.groesse, font:fett});
      });
    }

    /* Ort und Datum teilen sich ein Feld im Blatt */
    const ortDatum = [daten.kopf.ort, datumText(daten.kopf.datum)]
      .map(s => String(s || "").trim()).filter(Boolean).join(", ");
    const felder = [{box:blatt.ortDatumBox, leeren:true, wert:ortDatum}];
    blatt.kopf.forEach(f => {
      const roh = daten.kopf[f.id] || "";
      /* Auswahlfelder koennen einen anderen Text ins Blatt schreiben als in
         der Maske steht ("JA" -> "Konnektiert!"). */
      const wert = f.werte ? (f.werte[roh] || "") : roh;
      if(f.kasten){ felder.push({kasten:f.kasten, wert:wert}); return; }
      if(f.box) felder.push({box:f.box, leeren:Boolean(f.leeren),
                             groesse:f.groesse, wert:wert});
    });
    felder.forEach(f => {
      if(f.kasten){ schreibenBlock(seite, f.kasten, f.wert, normal); return; }
      const [x0, x1, linie] = f.box;
      const g = f.groesse || 6.8;
      const oben = linie - (f.groesse ? g * 1.32 : 9.0), unten = linie - 0.6;
      if(f.leeren){
        seite.drawRectangle({x:x0, y:SEITE_H - unten, width:x1 - x0,
                             height:unten - oben, color:weiss});
      }
      schreiben(seite, [x0, oben, x1, unten], f.wert, g, fett);
    });

    let n = 0;
    daten.zeilen.forEach(z => {
      if(!zeileBelegt(z) || n >= MAX(blatt)) return;
      n++;
      const bl = blockFuer(n);
      if(bl === null && blatt.bloecke) return;
      blatt.felder.forEach(f => {
        const spalte = bl ? bl.spalten[f.key] : f.spalte;
        if(!spalte) return;
        schreiben(seite, zelle(bl ? bl.zeile : n, spalte), z.f[f.key], 6.2, normal);
      });
      if(blatt.modus === "auswahl"){
        const t = blatt.mengen.find(m => m.name === z.taetigkeit);
        if(!t) return;
        const bem = z.bemerkung.trim();
        schreiben(seite, zelle(n, blatt.textspalte),
                  bem ? t.name + " (" + bem + ")" : t.name, 6.2, normal);
        schreiben(seite, zelle(n, t.spalte), zahlText(zahl(z.menge)), 6.4, fett);
      }else{
        blatt.mengen.forEach(m => {
          schreiben(seite, zelle(n, m.spalte), zahlText(zahl(z.m[m.key])), 6.4, fett);
        });
      }
    });

    if(unterschriftAn && unterschrift){
      const bild = await doc.embedPng(unterschrift);
      const f = blatt.unterschrift;
      const maxB = f.x1 - f.x0, maxH = f.unten - f.oben;
      const skala = Math.min(maxB / bild.width, maxH / bild.height);
      const b = bild.width * skala, h = bild.height * skala;
      seite.drawImage(bild, {
        x: f.x0 + (maxB - b) / 2,
        y: SEITE_H - f.oben - h,
        width: b, height: h
      });
    }

    return {bytes: await doc.save(), anzahl: n};
  }

  function dateiname(){
    const teil = s => String(s || "").replace(/[^A-Za-z0-9_-]+/g, "_").replace(/^_+|_+$/g, "");
    const daten = entwurf().kopf;
    const gebiet = teil(daten.nvt_gebiet) || "NVT";
    const tag = teil(datumText(daten.datum)) || teil(datumText(heute()));
    return "Aufmass_" + blatt.kuerzel + "_" + gebiet + "_" + tag + ".pdf";
  }

  async function speichern(bytes, name){
    try{
      const dl = window.claude && window.claude.use
        ? await window.claude.use("downloads") : null;
      if(dl){ await dl.save({filename:name, data:bytes}); return; }
    }catch(e){ /* kein Speicherdienst - unten den normalen Weg nehmen */ }
    const url = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  btnPdf.addEventListener("click", async () => {
    const fehler = offeneFehler();
    if(fehler.length){ melden("fehler", fehler.join("\n")); pruefenStill(); return; }
    if(!entwurf().zeilen.some(zeileBelegt)){
      melden("fehler", blatt.modus === "auswahl"
        ? "Noch keine Position eingetragen – bitte mindestens eine Tätigkeit wählen."
        : "Noch kein Hausanschluss eingetragen.");
      return;
    }
    btnPdf.disabled = true;
    const beschriftung = btnPdf.textContent;
    btnPdf.textContent = "Erstelle …";
    try{
      const {bytes, anzahl} = await pdfBauen();
      const name = dateiname();
      await speichern(bytes, name);
      melden("gut", anzahl + " Zeile(n) übertragen – " + name);
    }catch(e){
      melden("fehler", "Das PDF konnte nicht erstellt werden: "
             + (e && e.message ? e.message : e));
    }finally{
      btnPdf.disabled = false;
      btnPdf.textContent = beschriftung;
    }
  });

  btnAdd.addEventListener("click", () => {
    const zl = entwurf().zeilen;
    if(zl.length >= MAX(blatt)) return;
    zl.push(neueZeile()); sichern(); zeichnen();
    const letzte = elZeilen.lastElementChild;
    const feld = letzte && letzte.querySelector("select, input");
    if(feld) feld.focus();
  });

  /* Zweistufig statt confirm(): eingebettete Ansichten blockieren Dialoge,
     der Klick liefe dann ins Leere. */
  let leerenScharf = 0;
  function leerenZuruecksetzen(){
    leerenScharf = 0;
    btnLeer.textContent = "Alles leeren";
    btnLeer.classList.remove("btn-warn");
  }
  btnLeer.addEventListener("click", () => {
    if(!leerenScharf){
      leerenScharf = window.setTimeout(leerenZuruecksetzen, 5000);
      btnLeer.textContent = "Wirklich leeren?";
      btnLeer.classList.add("btn-warn");
      return;
    }
    window.clearTimeout(leerenScharf);
    leerenZuruecksetzen();
    entwuerfe[blatt.id] = frischerEntwurf(blatt);
    sichern(); kopfAufbauen(); zeichnen();
    melden("gut", "„" + blatt.name + "“ zurückgesetzt. Das andere Blatt bleibt unverändert.");
  });
  btnLeer.addEventListener("blur", () => {
    if(leerenScharf){ window.clearTimeout(leerenScharf); leerenZuruecksetzen(); }
  });

  BLAETTER.forEach(b => {
    const o = document.createElement("option");
    o.value = b.id; o.textContent = b.name;
    selBlatt.appendChild(o);
  });
  selBlatt.addEventListener("change", () => {
    const gewaehlt = BLAETTER.find(b => b.id === selBlatt.value);
    if(!gewaehlt) return;
    blatt = gewaehlt;
    sichern(); kopfAufbauen(); zeichnen(); melden("", "");
    leerenZuruecksetzen();
  });

  /* ===================== Start ===================== */
  try{
    const zuletzt = localStorage.getItem(SPEICHER_BLATT);
    const b = BLAETTER.find(x => x.id === zuletzt);
    if(b) blatt = b;
  }catch(e){ /* Grundblatt bleibt */ }
  try{
    const s = localStorage.getItem(SPEICHER_SIG);
    if(s && s.indexOf("data:image/") === 0){ unterschrift = s; unterschriftAn = true; }
  }catch(e){ /* ohne hinterlegte Unterschrift weiter */ }

  selBlatt.value = blatt.id;
  unterschriftZeichnen();
  kopfAufbauen();
  zeichnen();
})();
</script>
