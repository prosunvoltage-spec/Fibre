[project]
name = "vra-nvt-automation"
version = "0.1.0"
description = "Teil-automatisierte Erstellung technischer Unterlagen für verkehrsrechtliche Anordnungen (VRA) bei Glasfaser-Einblasarbeiten an Netzverteilerschränken (NVT)."
readme = "docs/PROJECT_PLAN.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Helder Santos GmbH & Co. KG" }]

dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",

    # Validation / DTOs
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Persistenz
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",

    # PDF / Bild / OCR
    "pymupdf>=1.24",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.13",

    # KI / Vision (Default-Provider)
    "anthropic>=0.42",

    # Word-Export
    "python-docx>=1.1",
    "jinja2>=3.1",

    # Sonstiges
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-dateutil",
]

postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "frontend*", "docs*", "scripts*", "knowledge*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: langsamer, benötigt DB",
    "regression: 25 Referenzfälle",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
    "E501",   # line-length wird ohnehin durch line-length gesteuert
    "UP042",  # str-Enum-Pattern ist bewusst gewählt (JSON-Serialisierbarkeit)
    "N818",   # Exception-Namen ohne 'Error'-Suffix sind sprachlich sinnvoll (z.B. InvalidStateTransition)
    "B008",   # FastAPI-Idiom: Depends()/File()/Form() als Default
    "RUF001", # en-dash "–" bewusst in Regex-Zeichenklassen (Hausnummer 12–14)
    "RUF003", # en-dash in Kommentaren bewusst zur Sprachpflege
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "N806",   # SessionLocal in Test-Fixtures folgt SQLAlchemy-Konvention
    "RUF059", # SessionLocal-Unpacking in Fixture-Tupeln ist explizit
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
